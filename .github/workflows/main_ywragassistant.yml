name: Build and deploy Python app to Azure Web App - ywragassistant

permissions:
  id-token: write   # 用于 OIDC 身份认证（Azure Login）
  contents: read    # 用于 actions/checkout 等操作
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and generate requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in
          pip freeze | grep -vE '^-e git\+https://github.com/EricWu23/rag-personal-assistant.*' > requirements.txt

      # Optional: add test step here

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03AE1A97D62C4EE695AD3FF3BBB13C07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3F27C9315F004CF58274E63A0F14CAE2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_603ABF895AD34E189F4C6B320D7BD817 }}

      - name: Deploy using source-based deployment (Oryx)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ywragassistant'
          slot-name: 'Production'
          package: '.'
